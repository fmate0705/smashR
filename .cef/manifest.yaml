metadata:
  description: >-
    SmashR is a premium smashburger restaurant in Budapest. A Hungarian-language restaurant website (magyar nyelvu etterem weboldal) with a home page, our story / about us, a menu (etlap) built from the live Foodora offer, a contact page with a location map, and a SmashR Experience brand page. Fresh beef, smash technique, street food culture, online food ordering via Foodora and Wolt, route planning and opening hours.
