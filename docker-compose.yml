# Deploys to the Klivo Docker hosting platform (Traefik file-provider routing).
# The container name and network embed the client slug "smashr"; if your platform
# client uses a different slug, regenerate with "cef generate --client-slug <slug>"
# or edit the two names below to match.
services:
  hosting_smashr_web:
    build: .
    container_name: hosting_smashr_web
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - '80'
    volumes:
      # Everything the restaurant edits in /admin — the menu, the hours, the phone
      # number — is written here. The image is replaced on every deploy, so this has
      # to be a volume: without it a redeploy would silently restore the shipped menu.
      # The path matches SMASHR_DATA_DIR, whose default is set in the Dockerfile.
      - smashr_content:/data
    networks:
      - client_smashr_net
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  smashr_content:

networks:
  client_smashr_net:
    external: true
